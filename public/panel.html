<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>初音 · 双屏控制台</title>
<style>
:root{color-scheme:dark;--mint:#39c5bb;--muted:#90b8b2}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 90% 0,#174c453f,transparent 50%),#081b1a;color:#eafff8;font:15px/1.6 "Microsoft YaHei UI","Segoe UI",sans-serif}main{max-width:1420px;margin:42px auto;padding:0 32px}header{display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}.eyebrow{color:var(--mint);letter-spacing:3px;font-size:12px}h1{font-size:30px;margin:5px 0}p{color:var(--muted);margin:6px 0}.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}button{cursor:pointer;border:1px solid #3b6b60;background:#19453c;color:#eafff8;border-radius:9px;padding:10px 18px;font:600 14px "Microsoft YaHei UI",sans-serif}button.primary{background:var(--mint);color:#052e29;border-color:var(--mint)}button.danger{background:transparent;color:#e2b9b5;border-color:#76544e}button:disabled{opacity:.5;cursor:wait}a{color:#79ded0;text-decoration:none}a:hover{text-decoration:underline}.sensors{margin:25px 0;display:flex;flex-wrap:wrap;gap:12px}.sensor{border:1px solid #31554d;padding:9px 16px;border-radius:10px;background:#102d26;color:#9bbdb5}.sensor b{color:#edfff8;margin-left:9px}#globalError{color:#ffc0af;min-height:24px}.screens{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(350px,1fr);gap:22px}.screen{background:#0e2b26;border:1px solid #315b50;border-radius:19px;overflow:hidden;min-width:0}.screen-head{display:flex;align-items:center;justify-content:space-between;padding:22px 24px 15px;gap:12px}h2{font-size:20px;margin:0}.resolution{font-size:12px;color:#8dafa6;letter-spacing:1px}.badge{white-space:nowrap;border:1px solid #4b665e;color:#abc0b8;font-size:12px;padding:4px 12px;border-radius:20px}.badge.on{border-color:#41a98c;color:#77eac1}.preview-area{height:280px;background:#061a16;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.preview-area img{display:block;max-width:100%;max-height:100%;object-fit:contain}.preview-area img:not([src]){visibility:hidden}.preview-area .empty{position:absolute;color:#6d998b;font-size:13px;pointer-events:none}.preview-area.has-frame .empty{display:none}.details{padding:18px 24px 24px}.counts{font-size:12px;color:#84aa9d;margin-bottom:16px}.error{min-height:24px;color:#ffc0af;font-size:12px;overflow-wrap:anywhere}label{color:#a9c7bb;font-size:12px;display:block;margin:12px 0 5px}input[type=url],select{background:#071e19;color:#e7fff2;border:1px solid #3a6456;border-radius:8px;padding:10px;width:100%;font:13px "Segoe UI",sans-serif}input[type=range]{accent-color:var(--mint);width:100%}.settings{display:grid;grid-template-columns:1fr 1fr;gap:18px}.settings label{display:flex;justify-content:space-between}select{font-size:13px}.note{font-size:12px;color:#84aa9d;margin-top:12px}footer{color:#729d8d;font-size:12px;margin:24px 0}.screen .actions{margin:18px 0 8px}@media(max-width:950px){.screens{grid-template-columns:1fr}main{padding:0 18px;margin:24px auto}.preview-area{height:260px}}
</style>
<main><header><div><div class="eyebrow">MIKU SCREEN HUB</div><h1>初音 · 双屏控制台</h1><p>两块屏幕，一个入口。网页和显示设置可分别调整。</p></div><div class="actions"><button class="primary" data-global="start-all">全部启动</button><button data-global="stop-all">全部停止</button><button class="danger" data-global="exit">退出程序</button></div></header>
<div class="sensors"><div class="sensor">CPU 温度<b id="cpuTemp">--</b></div><div class="sensor">GPU 占用<b id="gpuLoad">--</b></div><div class="sensor">内存占用<b id="ramLoad">--</b></div><div class="sensor">显存占用<b id="vramLoad">--</b></div></div><div id="globalError" role="alert"></div>
<div class="screens" id="screens"></div><footer>使用前退出原厂 AIGO 和 ASUS InfoHub。停止显示后，屏幕可能保留最后一帧。背景：Art by rurudo · 初音未来 © Crypton Future Media。</footer></main>
<script>
const descriptors={aigo:{name:'爱国者长条屏',resolution:'1920 × 462',note:'时间 · GPU 占用 · 内存占用 · 显存占用'},asus:{name:'华硕水冷屏',resolution:'320 × 320',note:'CPU 占用 · CPU 温度'}};
const initialized=new Set();let exited=false;
for(const [id,item] of Object.entries(descriptors)){
 const card=document.createElement('section');card.className='screen';card.id=id;
 card.innerHTML=`<div class="screen-head"><div><h2>${item.name}</h2><div class="resolution">${item.resolution}</div></div><span class="badge">等待连接</span></div><div class="preview-area"><span class="empty">等待第一帧</span><img class="preview" alt="${item.name}实时画面"></div><div class="details"><div class="counts">尚未开始</div><label>网页地址</label><input class="url" type="url" spellcheck="false" aria-label="${item.name}网页地址"><div class="settings"><div><label>目标帧率 <b class="fps-label">5 FPS</b></label><input class="fps" type="range" min="1" max="15" value="5" aria-label="${item.name}目标帧率"></div><div><label>图像质量 <b class="quality-label">80</b></label><input class="quality" type="range" min="30" max="95" value="80" aria-label="${item.name}图像质量"></div></div>${id==='asus'?'<label>安装方向补偿</label><select class="rotation" aria-label="水冷屏旋转"><option value="0">0°</option><option value="90">90°</option><option value="180">180°</option><option value="270">270°</option></select>':''}<div class="actions"><button class="primary" data-action="apply">应用并启动</button><button data-action="stop">停止</button><button data-action="default">内置界面</button><a href="/screens/${id}" target="_blank">网页预览 ↗</a></div><div class="note">${item.note}</div><div class="error" role="alert"></div></div>`;
 document.getElementById('screens').appendChild(card);
 const labels=()=>{card.querySelector('.fps-label').textContent=card.querySelector('.fps').value+' FPS';card.querySelector('.quality-label').textContent=card.querySelector('.quality').value;};
 card.querySelector('.fps').oninput=labels;card.querySelector('.quality').oninput=labels;
 for(const button of card.querySelectorAll('button'))button.onclick=async()=>{
  if(button.dataset.action==='default'){card.querySelector('.url').value=location.origin+'/screens/'+id;return;}
  const buttons=card.querySelectorAll('button');buttons.forEach(item=>item.disabled=true);
  try{card.querySelector('.error').textContent='';
   if(button.dataset.action==='apply'){await api(`screens/${id}/config`,{url:card.querySelector('.url').value,fps:+card.querySelector('.fps').value,quality:+card.querySelector('.quality').value,rotation:id==='asus'?+card.querySelector('.rotation').value:0});await api(`screens/${id}/start`);}
   else await api(`screens/${id}/stop`);await refresh();
  }catch(error){card.querySelector('.error').textContent=error.message;}
  finally{buttons.forEach(item=>item.disabled=false);}
 };
}
async function api(action,body={}){const response=await fetch('/api/'+action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),data=await response.json();if(!response.ok)throw Error(data.error||'操作失败');return data;}
const percent=value=>typeof value==='number'&&Number.isFinite(value)?Math.round(value)+'%':'--';
async function refresh(){if(exited)return;try{
 const response=await fetch('/api/status',{cache:'no-store'});if(!response.ok)throw Error('程序未连接');const state=await response.json();document.getElementById('globalError').textContent='';
 const stats=state.telemetry;document.getElementById('cpuTemp').textContent=typeof stats.cpuTemperature==='number'?Math.round(stats.cpuTemperature)+' °C':'--';document.getElementById('gpuLoad').textContent=percent(stats.gpu);document.getElementById('ramLoad').textContent=percent(stats.memory);document.getElementById('vramLoad').textContent=percent(stats.vram);
 for(const [id,screen] of Object.entries(state.screens)){
  const card=document.getElementById(id),badge=card.querySelector('.badge');badge.textContent=screen.running?'正在显示':screen.reconnecting?'正在重连':screen.error?'需要重试':'已停止';badge.className='badge'+(screen.running?' on':'');
  card.querySelector('.counts').textContent=`${screen.sent||0} 帧 · 约 ${screen.actualFps||0} FPS · 重传 ${screen.retries||0} 次 · 重连 ${screen.reconnects||0} 次`;
  card.querySelector('.error').textContent=screen.error||'';
  if(!initialized.has(id)){card.querySelector('.url').value=screen.config.url;card.querySelector('.fps').value=screen.config.fps;card.querySelector('.quality').value=screen.config.quality;if(id==='asus')card.querySelector('.rotation').value=screen.config.rotation;card.querySelector('.fps').oninput();initialized.add(id);}
  if(screen.sent){const image=card.querySelector('.preview');image.src=`/preview/${id}.jpg?t=${Date.now()}`;image.style.transform=id==='asus'?`rotate(${-screen.config.rotation}deg)`:'';card.querySelector('.preview-area').classList.add('has-frame');}
 }
 }catch(error){document.getElementById('globalError').textContent=error.message||'控制台未连接，请启动程序。';}}
for(const button of document.querySelectorAll('[data-global]'))button.onclick=async()=>{const buttons=document.querySelectorAll('[data-global]');buttons.forEach(item=>item.disabled=true);try{const result=await api(button.dataset.global);if(button.dataset.global==='exit'){exited=true;document.getElementById('globalError').textContent='程序已退出，两块屏幕均已停止更新。';for(const card of document.querySelectorAll('.screen')){card.querySelector('.badge').textContent='已退出';card.querySelector('.badge').className='badge';}document.querySelectorAll('button').forEach(item=>item.disabled=true);return;}const failures=(result.results||[]).filter(item=>!item.ok);await refresh();if(failures.length)document.getElementById('globalError').textContent=failures.map(item=>descriptors[item.id].name+'：'+item.error).join('；');}catch(error){document.getElementById('globalError').textContent=error.message;}finally{if(!exited)buttons.forEach(item=>item.disabled=false);}};
refresh();setInterval(refresh,1200);
</script></html>
